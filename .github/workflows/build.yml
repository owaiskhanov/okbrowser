name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish a GitHub release with the built exe"
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION_BASE: "1.12.2"

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-2022 (Server 2022, Windows 10 era) - required leg.
          - os: windows-2022
            tag: win2022
            blocking: true
          # windows-latest (Server 2025, Windows 11 era).
          - os: windows-latest
            tag: winlatest
            blocking: false

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.blocking }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Bar UI logic tests
        shell: pwsh
        run: node scripts/test-bar.js

      - name: Stamp automatic build version
        shell: pwsh
        run: |
          $version = "$env:VERSION_BASE.${{ github.run_number }}"
          $parts = $env:VERSION_BASE.Split('.')
          $info = Get-Content res/versioninfo.json -Raw | ConvertFrom-Json
          $info.FixedFileInfo.FileVersion.Major = [int]$parts[0]
          $info.FixedFileInfo.FileVersion.Minor = [int]$parts[1]
          $info.FixedFileInfo.FileVersion.Patch = [int]$parts[2]
          $info.FixedFileInfo.FileVersion.Build = [int]${{ github.run_number }}
          $info.FixedFileInfo.ProductVersion = $info.FixedFileInfo.FileVersion
          $info.StringFileInfo.FileVersion = $version
          $info.StringFileInfo.ProductVersion = $version
          $info | ConvertTo-Json -Depth 10 | Set-Content res/versioninfo.json
          "OK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate version resource
        working-directory: res
        run: go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest -o ../cmd/okbrowser/resource.syso versioninfo.json

      - name: Build
        run: |
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.appVersion=$env:OK_VERSION" -o dist/OKBrowser.exe ./cmd/okbrowser
          Get-Item dist\OKBrowser.exe | Select-Object Name, Length | Format-List

      - name: Smoke test on real Windows
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Exe dist/OKBrowser.exe

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OKBrowser-windows-amd64-${{ matrix.tag }}
          path: |
            dist/OKBrowser.exe
            dist/smoke-diagnostics.txt

      # On-demand: push the Windows-verified exe + diagnostics back to the
      # working branch. Triggers when the commit message contains "[publish]".
      - name: Publish verified build to working branch
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish]') && startsWith(github.ref, 'refs/heads/arena/')
        shell: bash
        run: |
          git config user.name "arena-ci"
          git config user.email "noreply@arena.ai"
          mkdir -p ".ci-build/${{ matrix.tag }}"
          cp dist/OKBrowser.exe ".ci-build/${{ matrix.tag }}/" 2>/dev/null || true
          cp dist/smoke-diagnostics.txt ".ci-build/${{ matrix.tag }}/" 2>/dev/null || true
          git add -f ".ci-build/${{ matrix.tag }}"
          git commit -m "ci: verified build + diagnostics for ${{ matrix.tag }} [ci skip]" >/dev/null 2>&1 || echo "no changes to publish"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" >/dev/null 2>&1 && git push >/dev/null 2>&1; then
              echo "published .ci-build/${{ matrix.tag }}"
              exit 0
            fi
            sleep $((i * 3))
          done
          echo "could not publish back to branch (continuing without failing the build)"
          exit 0

  # Every successful source push publishes its Windows-verified executable.
  # The workflow run number provides a monotonic fourth version component.
  release:
    if: needs.windows.result == 'success' && (github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[android]')))
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: OKBrowser-windows-amd64-win2022
          path: dist

      - name: Publish automatic version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${VERSION_BASE}.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          cat > notes.md <<EOF
          **OK Browser ${VERSION}** — automatically built and verified from commit ${GITHUB_SHA:0:7}.

          - Single ~4 MB portable OKBrowser.exe
          - Built and smoke-tested on Windows 2022 and Windows latest
          - Includes the latest browser UX and stability changes

          **Requirements:** Windows 10 (1607+) or Windows 11, 64-bit, with Microsoft Edge WebView2 Runtime.
          EOF
          gh release create "$TAG" dist/OKBrowser.exe \
            --title "OK Browser ${VERSION}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest

  # One-off mobile companion build. Normal future pushes continue to build only
  # the Windows executable; include [android] in a commit to run this job.
  mobile_once:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[android]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build installable APK
        run: gradle --no-daemon :mobile:assembleDebug

      - name: Upload APK beside the Windows executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh release view --json tagName --jq .tagName)"
          cp mobile/build/outputs/apk/debug/mobile-debug.apk OKBrowser-Android.apk
          gh release upload "$TAG" OKBrowser-Android.apk --clobber
          echo "Uploaded APK to $TAG"
