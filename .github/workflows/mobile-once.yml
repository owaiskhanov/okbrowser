name: Build Android APK (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build installable APK
        run: gradle --no-daemon :mobile:assembleDebug

      - name: Prepare release asset
        run: cp mobile/build/outputs/apk/debug/mobile-debug.apk OKBrowser-Android.apk

      - name: Upload APK to the current OK Browser release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh release view --json tagName --jq .tagName)"
          gh release upload "$TAG" OKBrowser-Android.apk --clobber
          echo "Uploaded Android APK to $TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: OKBrowser-Android
          path: OKBrowser-Android.apk
